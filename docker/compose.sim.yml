# Simulated 8-node mesh. Start with: bash scripts/sim-up.sh
# Published on the host: 3200 = hub (dashboard, node app /app/, /api/log), 3100 = proxy (/nodes/<id>/, /ether/).
# The ether and the nodes publish no ports; they reach each other by service name.
# Topology (who hears whom): docker/topology.txt at startup; live changes only through the hub (dashboard).
# Birds added from the dashboard are extra containers started by the nursery (which mounts the Docker socket).
x-ether-token: &etherToken sim-topology-token
x-nursery-token: &nurseryToken sim-nursery-token
x-node: &node
  image: birdsong-node
  build:
    context: ..
    dockerfile: docker/Dockerfile.node
  depends_on: [ether, hub]
  restart: on-failure

services:
  ether:
    image: birdsong-node
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    entrypoint: ["node", "packages/ether/src/server.ts"]
    environment:
      ETHER_PORT: "7080"
      ETHER_RANGE: "1.5"
      ETHER_NOISE_RMS: "0.002"
      ETHER_TOPOLOGY_FILE: /etc/birdsong/topology.txt
      # Only the hub holds this token, and the proxy does not forward /ether/topology.
      ETHER_CONTROL_TOKEN: *etherToken
    volumes: ["./topology.txt:/etc/birdsong/topology.txt:ro"]
  hub:
    image: birdsong-node
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    entrypoint: ["node", "packages/dashboard/src/server/hub.ts"]
    environment:
      HUB_PORT: "3200"
      CHANNEL_PASSPHRASE: demo-flock
      # Browser-facing URLs (opened by the dashboard page on the host):
      ETHER_URL: ws://localhost:3100/ether
      PROXY_URL: http://localhost:3100
      # Address of this computer on the local network, for the "Send a message" QR code (set by scripts/demo.sh).
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
      HUB_LOG_FILE: /app/logs/interactions.ndjson
      # Internal: the hub relays topology changes from the dashboard to the ether.
      ETHER_CONTROL_URL: http://ether:7080
      ETHER_CONTROL_TOKEN: *etherToken
      # Internal: the hub asks the nursery to add and remove birds.
      NURSERY_URL: http://nursery:7090
      NURSERY_TOKEN: *nurseryToken
    volumes: ["../logs:/app/logs"]
    ports: ["3200:3200"]
  # Starts and stops bird containers for the dashboard's Birds panel. Reached only by the hub (token, no port).
  # It needs the Docker socket, which gives it full control of Docker on this machine.
  nursery:
    image: birdsong-node
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    entrypoint: ["node", "packages/node-runtime/src/nursery.ts"]
    environment:
      NURSERY_PORT: "7090"
      NURSERY_TOKEN: *nurseryToken
      NURSERY_BIRD_ARGS: --audio ether --ether ws://ether:7080 --observatory ws://hub:3200 --key demo-flock
    volumes: ["${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"]
  proxy:
    image: caddy:2
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: ["3100:3100"]
    depends_on: [ether, bird0, bird1, bird2, bird3, bird4, bird5, bird6, bird7]
  bird0:
    <<: *node
    command: ["--audio", "ether", "--ether", "ws://ether:7080", "--observatory", "ws://hub:3200", "--key", "demo-flock", "--env", "quiet", "--id", "0", "--x", "0", "--y", "0", "--port", "8080"]
  bird1:
    <<: *node
    command: ["--audio", "ether", "--ether", "ws://ether:7080", "--observatory", "ws://hub:3200", "--key", "demo-flock", "--env", "quiet", "--id", "1", "--x", "1", "--y", "0", "--port", "8080"]
  bird2:
    <<: *node
    command: ["--audio", "ether", "--ether", "ws://ether:7080", "--observatory", "ws://hub:3200", "--key", "demo-flock", "--env", "quiet", "--id", "2", "--x", "2", "--y", "0", "--port", "8080"]
  bird3:
    <<: *node
    command: ["--audio", "ether", "--ether", "ws://ether:7080", "--observatory", "ws://hub:3200", "--key", "demo-flock", "--env", "quiet", "--id", "3", "--x", "3", "--y", "0", "--port", "8080"]
  bird4:
    <<: *node
    command: ["--audio", "ether", "--ether", "ws://ether:7080", "--observatory", "ws://hub:3200", "--key", "demo-flock", "--env", "quiet", "--id", "4", "--x", "0", "--y", "1", "--port", "8080"]
  bird5:
    <<: *node
    command: ["--audio", "ether", "--ether", "ws://ether:7080", "--observatory", "ws://hub:3200", "--key", "demo-flock", "--env", "quiet", "--id", "5", "--x", "1", "--y", "1", "--port", "8080"]
  bird6:
    <<: *node
    command: ["--audio", "ether", "--ether", "ws://ether:7080", "--observatory", "ws://hub:3200", "--key", "demo-flock", "--env", "quiet", "--id", "6", "--x", "2", "--y", "1", "--port", "8080"]
  bird7:
    <<: *node
    command: ["--audio", "ether", "--ether", "ws://ether:7080", "--observatory", "ws://hub:3200", "--key", "demo-flock", "--env", "quiet", "--id", "7", "--x", "3", "--y", "1", "--port", "8080"]
