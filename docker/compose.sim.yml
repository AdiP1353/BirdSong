    ports: ["8083:8080"]
  bird4:
    <<: *node
    command: ["--audio", "ether", "--ether", "ws://ether:7080", "--observatory", "ws://hub:7070", "--key", "demo-flock", "--env", "quiet", "--id", "4", "--x", "0", "--y", "1", "--port", "8080"]
    ports: ["8084:8080"]
  bird5:
